name: Episode Validation Comment

on:
  workflow_run:
    workflows: ["Validate Episode Files"]
    types:
      - completed

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download PR validation artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-validation-data
          path: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR number
        id: pr
        run: |
          number=$(tr -cd '0-9' < pr/NR | head -c 10)
          if [ -z "$number" ]; then
            echo "::error::PR number artifact is not numeric"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Create comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: episode-validation
          number: ${{ steps.pr.outputs.number }}
          path: pr/validation-report.md
